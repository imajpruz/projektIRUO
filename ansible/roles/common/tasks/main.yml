---
# Baseline for Moodle nodes. Both clouds use a RHEL-family application image.

- name: Install EPEL and Remi repository definitions
  ansible.builtin.dnf:
    name:
      - "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
    state: present

- name: Reset the default PHP module
  ansible.builtin.command: dnf -y module reset php
  changed_when: false

- name: Enable Moodle-compatible PHP and MariaDB streams
  ansible.builtin.command:
    cmd: dnf -y module enable php:remi-8.2 mariadb:10.11
  changed_when: false

- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  register: pkg_result
  # Cloud images often race their own unattended-upgrade or dnf-makecache on
  # first boot, which shows up as a lock error rather than a real failure.
  retries: 3
  delay: 15
  until: pkg_result is succeeded

# firewalld runs by default on Rocky and CentOS cloud images and will drop
# traffic that the cloud's security group already allowed. Two firewalls in the
# path, both must agree - a genuine difference from the Azure Ubuntu bastion,
# which has no host firewall enabled.
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
