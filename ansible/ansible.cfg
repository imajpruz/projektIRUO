[defaults]
inventory            = inventory/
roles_path           = roles
host_key_checking    = False
stdout_callback      = ansible.builtin.default
callback_result_format = yaml
callback_format_pretty = true
interpreter_python   = auto_silent
retry_files_enabled  = False
display_skipped_hosts = False

[ssh_connection]
# ControlMaster keeps one TCP session per host open through the bastion instead
# of re-dialling for every task. On a proxied connection this is the difference
# between a 4-minute and a 20-minute run.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o StrictHostKeyChecking=no
pipelining = True
retries = 3

[privilege_escalation]
become = True
become_method = sudo
become_user = root
